<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2000" viewBox="0 0 1600 2000"><rect width="100%" height="100%" fill="white"/><text x="800" y="75" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="46" font-weight="bold">双侧距离分解与共同净空预算</text><text x="800" y="190" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="39" font-weight="normal">（a）每侧中心距离的组成</text><rect x="160" y="300" width="690" height="175" fill="white" stroke="black" stroke-width="4"/><rect x="850" y="300" width="590" height="175" fill="white" stroke="black" stroke-width="4"/><text x="505" y="350" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="32" font-weight="normal">不可压缩下限 l</text><text x="505" y="415" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="32" font-weight="normal">车身方向占用＋有效误差＋净距</text><text x="1145" y="350" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="35" font-weight="normal">可分配距离 q</text><text x="1145" y="415" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="35" font-weight="normal">max(0, d0 − l)</text><text x="800" y="585" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="40" font-weight="normal">动态中心距离 d = l ＋ λq，0 ≤ λ ≤ 1</text><text x="800" y="670" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="40" font-weight="normal">λ = 1：保留默认附加距离</text><text x="800" y="755" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="40" font-weight="normal">λ = 0：仅释放附加部分，硬下限保持</text><text x="800" y="915" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="39" font-weight="normal">（b）左右两侧共同占用通道净宽</text><rect x="120" y="1030" width="400" height="170" fill="white" stroke="black" stroke-width="3"/><rect x="520" y="1030" width="130" height="170" fill="white" stroke="black" stroke-width="3"/><rect x="650" y="1030" width="300" height="170" fill="white" stroke="black" stroke-width="3"/><rect x="950" y="1030" width="130" height="170" fill="white" stroke="black" stroke-width="3"/><rect x="1080" y="1030" width="400" height="170" fill="white" stroke="black" stroke-width="3"/><text x="320" y="1115" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="43" font-weight="normal">l右</text><text x="585" y="1115" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="31" font-weight="normal">λq右</text><text x="800" y="1080" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="34" font-weight="normal">参考点</text><text x="800" y="1145" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="34" font-weight="normal">允许区间</text><text x="1015" y="1115" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="31" font-weight="normal">λq左</text><text x="1280" y="1115" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="43" font-weight="normal">l左</text><polyline points="120,1320 1480,1320" fill="none" stroke="black" stroke-width="2"/><polyline points="1463.7919521576518,1327.8293796140022 1480,1320 1463.7919521576518,1312.1706203859978" fill="none" stroke="black" stroke-width="2"/><polyline points="1480,1320 120,1320" fill="none" stroke="black" stroke-width="2"/><polyline points="136.20804784234818,1312.1706203859978 120,1320 136.20804784234818,1327.8293796140022" fill="none" stroke="black" stroke-width="2"/><text x="800.0" y="1375.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="35" font-weight="normal">通道净宽 W</text><text x="800" y="1460" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="43" font-weight="bold">W − l左 − l右 − λ(q左＋q右) ≥ 2η</text><rect x="140" y="1590" width="1320" height="310" fill="white" stroke="black" stroke-width="3"/><text x="800.0" y="1691.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="36" font-weight="normal">局部净空足够只是必要筛选条件</text><text x="800.0" y="1745.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="36" font-weight="normal">仍需保持航向、速度与转向状态的连续连接</text><text x="800.0" y="1799.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="36" font-weight="normal">若硬下限已超过容量，λ降到0也不得放行</text></svg>