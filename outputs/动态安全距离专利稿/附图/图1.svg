<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2000" viewBox="0 0 1600 2000"><rect width="100%" height="100%" fill="white"/><text x="800" y="75" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="46" font-weight="bold">动态安全距离计算及通行控制流程</text><rect x="180" y="155" width="960" height="145" fill="white" stroke="black" stroke-width="3"/><text x="660.0" y="200.5" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="36" font-weight="normal">S1 原始允许区域及禁行边界</text><text x="660.0" y="254.5" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="36" font-weight="normal">建立有序通道约束截面</text><polyline points="660,300 660,365" fill="none" stroke="black" stroke-width="3"/><polyline points="652.1706203859978,348.7919521576518 660,365 667.8293796140022,348.7919521576518" fill="none" stroke="black" stroke-width="3"/><rect x="180" y="365" width="960" height="145" fill="white" stroke="black" stroke-width="3"/><text x="660.0" y="410.5" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="36" font-weight="normal">S2 车辆轮廓、当前状态及有效误差界</text><text x="660.0" y="464.5" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="36" font-weight="normal">分别计算左右不可压缩距离下限</text><polyline points="660,510 660,575" fill="none" stroke="black" stroke-width="3"/><polyline points="652.1706203859978,558.7919521576518 660,575 667.8293796140022,558.7919521576518" fill="none" stroke="black" stroke-width="3"/><rect x="180" y="575" width="960" height="145" fill="white" stroke="black" stroke-width="3"/><text x="660.0" y="620.5" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="36" font-weight="normal">S3 默认中心距离分解</text><text x="660.0" y="674.5" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="36" font-weight="normal">下限 l ＋ 可分配距离 q</text><polyline points="660,720 660,785" fill="none" stroke="black" stroke-width="3"/><polyline points="652.1706203859978,768.7919521576518 660,785 667.8293796140022,768.7919521576518" fill="none" stroke="black" stroke-width="3"/><rect x="180" y="785" width="960" height="145" fill="white" stroke="black" stroke-width="3"/><text x="660.0" y="830.5" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="36" font-weight="normal">S4 候选保留系数 λ 与双侧净空预算</text><text x="660.0" y="884.5" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="36" font-weight="normal">形成有状态的动态距离约束</text><polyline points="660,930 660,995" fill="none" stroke="black" stroke-width="3"/><polyline points="652.1706203859978,978.7919521576518 660,995 667.8293796140022,978.7919521576518" fill="none" stroke="black" stroke-width="3"/><rect x="180" y="995" width="960" height="145" fill="white" stroke="black" stroke-width="3"/><text x="660.0" y="1040.5" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="36" font-weight="normal">S5 构建运动原语连接</text><text x="660.0" y="1094.5" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="36" font-weight="normal">连续扫掠及沿途停车分支校验</text><polyline points="660,1140 660,1205" fill="none" stroke="black" stroke-width="3"/><polyline points="652.1706203859978,1188.7919521576518 660,1205 667.8293796140022,1188.7919521576518" fill="none" stroke="black" stroke-width="3"/><rect x="180" y="1205" width="960" height="145" fill="white" stroke="black" stroke-width="3"/><text x="660.0" y="1250.5" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="36" font-weight="normal">S6 当前状态前向可达</text><text x="660.0" y="1304.5" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="36" font-weight="normal">出口状态后向可续行</text><polyline points="660,1350 660,1415" fill="none" stroke="black" stroke-width="3"/><polyline points="652.1706203859978,1398.7919521576518 660,1415 667.8293796140022,1398.7919521576518" fill="none" stroke="black" stroke-width="3"/><rect x="180" y="1415" width="960" height="145" fill="white" stroke="black" stroke-width="3"/><text x="660.0" y="1487.5" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="36" font-weight="normal">S7 有贯通状态链且停车分支有效？</text><polyline points="660,1560 660,1625" fill="none" stroke="black" stroke-width="3"/><polyline points="652.1706203859978,1608.7919521576518 660,1625 667.8293796140022,1608.7919521576518" fill="none" stroke="black" stroke-width="3"/><rect x="180" y="1625" width="960" height="145" fill="white" stroke="black" stroke-width="3"/><text x="660.0" y="1670.5" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="36" font-weight="normal">S8 输出首段有效控制</text><text x="660.0" y="1724.5" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="36" font-weight="normal">滚动复核状态与双侧距离</text><text x="710" y="1590" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="32" font-weight="normal">是</text><rect x="1200" y="1380" width="340" height="205" fill="white" stroke="black" stroke-width="3"/><text x="1370.0" y="1439.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="29" font-weight="normal">拒绝进入</text><text x="1370.0" y="1482.5" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="29" font-weight="normal">按有效分支停车</text><text x="1370.0" y="1526.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="29" font-weight="normal">失效则故障处理</text><polyline points="1140,1487 1200,1487" fill="none" stroke="black" stroke-width="3"/><polyline points="1183.7919521576518,1494.8293796140022 1200,1487 1183.7919521576518,1479.1706203859978" fill="none" stroke="black" stroke-width="3"/><text x="1170" y="1440" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="28" font-weight="normal">否</text><polyline points="180,1695 90,1695 90,435 180,435" fill="none" stroke="black" stroke-width="3" stroke-dasharray="15 15"/><polyline points="163.79195215765182,442.82937961400216 180,435 163.79195215765182,427.17062038599784" fill="none" stroke="black" stroke-width="3"/><text x="800" y="1880" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="37" font-weight="normal">硬下限始终有效；λ只分配默认附加距离。</text></svg>