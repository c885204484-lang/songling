      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node
      - nav2_is_battery_charging_condition_bt_node

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: False

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: False

controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 20.0 # 🌟 建议提高到 20Hz，真车控制更灵敏，减少 TF 延迟报错
    transform_tolerance: 0.1  # 🌟 容忍度放宽：10秒移动 10 厘米即可，防止误判卡死
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"] 
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.4 # 提高要求：3 秒内必须产生 0.4 米的真实位移，否则就算卡死！
      movement_time_allowance: 3.0 # 缩短容忍时间
      
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 1.5        # 从 0.3 改为 1.0 或 1.5 米。小车只要进入目标周边 1.5 米的圆圈内，就判定任务成功。
      yaw_goal_tolerance: 3.14

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.6
       
# 必须让下面这些参数生效！
      lookahead_dist: 2.5                # 看远一点，阿克曼才能走出平滑曲线
      max_lookahead_dist: 3.5      
      max_angular_vel: 0.5               # 限制打方向盘的速度，防止抽搐
      use_rotate_to_heading: false       # 严禁原地自转
      max_robot_pose_search_dist: 15.0
      lookahead_time: 1.5    
# ==========================================
#       # 🌟 核心修改区：专治“阿克曼起步画圈综合征”
#       # ==========================================
      
#       # 1. 加大前瞻距离（Lookahead Distance）
#       # 将前瞻距离拉远，小车就不会去追车头侧后方或极近距离的纠偏点。
#       # 对于 1.9m 转弯半径的车，建议设为 2.0 到 3.0 之间。
#       lookahead_dist: 2.5      
#       # 2. 扩大最大前瞻距离限制
#       # 防止速度加快时，动态前瞻点被限制得太死。
#       max_lookahead_dist: 3.5      
#       # 3. 限制最大转向角速度
#       # 避免控制器为了追近处的点，瞬间输出满舵导致车辆进入极限死区转圈。
#       max_angular_vel: 0.5       
#       # 4. 关闭原地旋转选项 (极其重要)
#       # 很多时候纯跟踪会因为横向误差大而尝试让车子像差速轮一样原地自转脱困。
#       # 阿克曼底盘绝对做不到，必须坚决关掉！
#       use_rotate_to_heading: false      
#       # 5. 放宽横向路径贴合要求
#       # 让小车可以走平滑的曲线逐渐靠拢高德路线，而不是强行用锐角切进去。
#       # 控制器在速度缩放时，会使用这个参数来评估当前转向是否过于剧烈。
#       max_robot_pose_search_dist: 15.0
#       # 6. 放宽起始点容忍度
#       # 增大控制器对“偏离路径多远算失败”的宽容度，防止刚启动就报状态码 6。women 
#       max_allowed_time_to_collision_upd_error: 5.0 # (可选参数，取决于你的 Nav2 版本)

      
      use_rotate_to_heading: false
      allow_reversing: false  # 一般不建议自动倒车，先设为 false
      
      use_velocity_scaled_lookahead_dist: true
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 2.0 #最小转弯半径（m）
      regulated_linear_scaling_min_speed: 0.25
      # use_collision_detection: true
      # max_allowed_time_to_collision_up_to_carrot: 1.0
      inflation_cost_scaling_factor: 5.0
# 🌟 关键修改 2：开启并调大碰撞检测时间
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 2.0  # 从 1.0秒 改为 2.5秒。
      # # 解释：意思是如果控制器预测小车沿当前速度开过去，在 2.5 秒内会撞上障碍物，它就会立刻减速或触发避障动作！
      
      # 👇 强制添加这三行
      use_cost_regulated_linear_velocity_scaling: true 
      cost_scaling_dist: 0.6  # 距离障碍物多远开始减速（米）
      cost_scaling_gain: 1.0  # 减速的倍率，越大减速越猛



local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0 # 重绘频率
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: False
      transform_tolerance: 0.5 # 局部代价地图的容忍度
      rolling_window: true
      width: 20
      height: 20
      resolution: 0.05
      footprint: "[[-0.41, -0.32], [-0.41, 0.32], [0.41, 0.32], [0.41, -0.32]]"
      plugins: ["obstacle_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0    # 这个值越小，障碍物周围的“高代价危险区”范围就越大，小车会离得更远
        inflation_radius: 0.6       # 🌟 关键修改：将膨胀半径加大（例如从 0.45 加大到 0.8 米或 1.0 米）
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        # 告诉 Nav2 我们现在有两个“眼睛”：雷达(scan) 和 相机(camera)
        observation_sources: scan # camera
        scan:
          topic: /scan
          min_obstacle_height: 0.15 # 🌟 稍微调高一点点，避开真车行驶时由于颠簸导致的地面误识别
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          inf_is_valid: True # 如果雷达射线射向天空或没返回数据（inf），不将其作为清除地图的依据。
          data_type: "LaserScan"
          raytrace_max_range: 16.0
          obstacle_max_range: 14.5
          raytrace_min_range: 0.2
          obstacle_min_range: 0.2 # 忽略极近距离噪点和反射
        # ==========================================
        # 🌟 新增：深度相机避障源
        # ==========================================
      #   camera:
      #     # 这里填入你 Astra Pro 输出的深度点云话题，或者是你 YOLO 3D 转换后的障碍物点云话题
      #     topic: /camera/depth/points_raw
      #     data_type: "PointCloud2"
      #     qos_reliability: "best_effort"
      #     qos_durability: "volatile"
      #     qos_history: "keep_last"
      #     qos_depth: 1
      #     marking: True       # 发现障碍物时，标记在地图上
      #     clearing: True      # 障碍物移走时，从地图上清除
      #     max_obstacle_height: 1.5  # 高于 1.5 米的物体忽略（比如天花板、树枝）
      #     min_obstacle_height: 0.05 # 低于 5 厘米的物体忽略（防止把地面噪点当成障碍物）
      #     obstacle_range: 2.5       # 只处理 2.5 米内的视觉障碍物（深度相机远距离误差大）
      #     raytrace_range: 3.0       # 清除 3.0 米内的视觉历史障碍物
      # always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 3.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: False
      transform_tolerance: 5.0
      footprint: "[[-0.41, -0.32], [-0.41, 0.32], [0.41, 0.32], [0.41, -0.32]]"
      resolution: 0.25 # 分辨率
      width: 300
      height: 300
      track_unknown_space: true
      plugins: ["obstacle_layer", "inflation_layer"]
      rolling_window: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          inf_is_valid: True
          data_type: "LaserScan"
          raytrace_max_range: 16.0
          obstacle_max_range: 14.5
          raytrace_min_range: 0.2
          obstacle_min_range: 0.2
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0    # 这个值越小，障碍物周围的“高代价危险区”范围就越大，小车会离得更远
        inflation_radius: 0.8       # 🌟 关键修改：将膨胀半径加大（例如从 0.45 加大到 0.8 米或 1.0 米）
      always_send_full_costmap: True

map_saver:
  ros__parameters:
    use_sim_time: False
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 2.0
    use_sim_time: False
    transform_tolerance: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: False
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
      # 配置倒车的具体参数
      simulate_ahead_time: 0.1
      backup_x: -2.0     # 每次脱困尝试往后倒 1.0 米
      backup_speed: -0.5 # 倒车速度 0.3 m/s
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 1.0
    use_sim_time: False
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.3
    min_rotational_vel: 0.1
    rotational_acc_lim: 1.0

robot_state_publisher:
  ros__parameters:
    use_sim_time: False

waypoint_follower:
  ros__parameters:
    use_sim_time: False
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: False
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.8, 0.0, 0.4]
    min_velocity: [-0.6, 0.0, -0.4]
    max_accel: [1.5, 0.0, 1.0]
    max_decel: [-2.5, 0.0, -1.0]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0