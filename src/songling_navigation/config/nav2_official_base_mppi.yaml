controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 10.0
    transform_tolerance: 0.5 # 控制器的容忍度
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    odom_topic: /odom
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"] 
    controller_plugins: ["FollowPath"]

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    # Goal checker parameters
    #precise_goal_checker:
    #  plugin: "nav2_controller::SimpleGoalChecker"
    #  xy_goal_tolerance: 0.25
    #  yaw_goal_tolerance: 0.25
    #  stateful: True
    general_goal_checker:
# 🌟 核心修复：把 True 改为 False！
      # 这意味着：不需要等待底盘完全物理静止，只要距离进入 0.8 米，瞬间宣布到达！
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.80
      yaw_goal_tolerance: 3.14
      # ==========================================
      # 🌟 必须新增这两行：赋予小车“运动中打卡”的特权！
      # ==========================================
      trans_stopped_velocity: 0.20  # 🌟 必须加！线速度降到 0.2 以下才算真停
      rot_stopped_velocity: 0.20    # 🌟 必须加！角速度降到 0.2 以下才算真停
    # DWB parameters
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      # 适当缩短预判时间，让它更关注眼前的转向，而不是太远的前方
      time_steps: 40       # 🌟 从 56 降到 40
      model_dt: 0.1
      batch_size: 1000
      vx_std: 0.20         # 🌟 原为 0.1，调大。允许尝试更多速度变化
      vy_std: 0.0
      wz_std: 0.15         # 从 0.60 降到 0.15
      vx_max: 1.0
      vx_min: -0.5        # 🌟 从 -0.3 改为 -0.5，给 MPPI 更充足的倒车采样空间
      vy_max: 0.0
      wz_max: 0.35         # 从 0.55 降到 0.35
      wz_min: -0.35        # 从 -0.55 降到 -0.35
      iteration_count: 1
      prune_distance: 1.7
      transform_tolerance: 0.5
      temperature: 0.3
      gamma: 0.015
      motion_model: "Ackermann"
      visualize: true      #仅在调试时短暂开启
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      AckermannConstraints:
        # 🌟 同步局部控制器的物理限制
        min_turning_r: 1.5
      critics:
        [
          "ConstraintCritic",
          "CostCritic",
          "GoalCritic",
          "GoalAngleCritic",
          "PathAlignCritic",
          "PathFollowCritic",
          "PathAngleCritic",
          "PreferForwardCritic",
        ]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 200.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 1.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PreferForwardCritic:
        enabled: false    # 🌟 核心修改：改为 false！彻底关掉“必须朝前开”的执念！允许顺滑倒车。
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
      # Option to replace Cost and use Obstacles instead
      # ObstaclesCritic:
      #   enabled: true
      #   cost_power: 1
      #   repulsion_weight: 1.5
      #   critical_weight: 20.0
      #   consider_footprint: false
      #   collision_cost: 10000.0
      #   collision_margin_distance: 0.1
      #   near_goal_distance: 0.5
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        trajectory_point_step: 2
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 15.0  # 🌟 从 10.0 提高到 15.0，强制底盘死死咬住全局规划的绿线，起步就给我转弯，别自己往前溜
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        # 🌟 必须改为 true！否则 MPPI 不知道全局规划器要求这几米是倒车
        use_path_orientations: true
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 1.0  # 从 2.0 降到 1.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 1.0  # 从 2.0 降到 1.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        forward_preference: false # 🌟 核心修改：改为 false，配合全局路径的倒车指令
        mode: 2
      # VelocityDeadbandCritic:
      #   enabled: true
      #   cost_power: 1
      #   cost_weight: 35.0
      #   deadband_velocities: [0.1, 0.0, 0.05]
      # TwirlingCritic:
      #   enabled: true
      #   twirling_cost_power: 1
      #   twirling_cost_weight: 10.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_link
      transform_tolerance: 0.5 # 局部代价地图的容忍度
      use_sim_time: False
      rolling_window: true
      width: 20
      height: 20
      resolution: 0.05
      footprint: "[[-0.41, -0.32], [-0.41, 0.32], [0.41, 0.32], [0.41, -0.32]]"
      plugins: ["obstacle_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 15.0    # 这个值越小，障碍物周围的“高代价危险区”范围就越大，小车会离得更远
        inflation_radius: 0.55       # 🌟 关键修改：将膨胀半径加大（例如从 0.45 加大到 0.8 米或 1.0 米）
      # denoise_layer:
      #   plugin: "nav2_costmap_2d::DenoiseLayer"
      #   enabled: true
      #   minimal_group_size: 2  # 默认2，移除孤立的单个障碍物格子[reference:11]
      # # group_connectivity_type: 8 # 默认8邻域连接
      
      # voxel_layer:
      #   plugin: "nav2_costmap_2d::VoxelLayer"
      #   enabled: True
      #   publish_voxel_map: True
      #   origin_z: 0.0
      #   z_resolution: 0.05
      #   z_voxels: 16
      #   max_obstacle_height: 2.0
      #   mark_threshold: 0
      #   observation_sources: pointcloud
      #   pointcloud:
      #     topic: /camera/camera/depth/color/points
      #     max_obstacle_height: 0.27
      #     min_obstacle_height: 0.015
      #     clearing: True
      #     marking: True
      #     data_type: "PointCloud2"
      #     raytrace_max_range: 3.0
      #     raytrace_min_range: 0.0
      #     obstacle_max_range: 2.5
      #     obstacle_min_range: 0.0
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        # 告诉 Nav2 我们现在有两个“眼睛”：雷达(scan) 和 相机(camera)
        observation_sources: scan # camera
        scan:
          topic: /scan
          min_obstacle_height: 0.1
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          inf_is_valid: True # 如果雷达射线射向天空或没返回数据（inf），不将其作为清除地图的依据。
          data_type: "LaserScan"
          raytrace_max_range: 16.0
          obstacle_max_range: 14.5
          raytrace_min_range: 0.5
          obstacle_min_range: 0.5 # 忽略极近距离噪点和反射
          # ==========================================
          # 🌟 必须加上的两行“除噪核心参数”：
          # ==========================================
          inf_is_valid: true         # 👈 第一把利器：允许使用“无穷远”清除
        # ==========================================
        # 🌟 新增：深度相机避障源
        # ==========================================
      #   camera:
      #     # 这里填入你 Astra Pro 输出的深度点云话题，或者是你 YOLO 3D 转换后的障碍物点云话题
      #     topic: /camera/depth/points_raw
      #     data_type: "PointCloud2"
      #     qos_reliability: "best_effort"
      #     qos_durability: "volatile"
      #     qos_history: "keep_last"
      #     qos_depth: 1
      #     marking: True       # 发现障碍物时，标记在地图上
      #     clearing: True      # 障碍物移走时，从地图上清除
      #     max_obstacle_height: 1.5  # 高于 1.5 米的物体忽略（比如天花板、树枝）
      #     min_obstacle_height: 0.05 # 低于 5 厘米的物体忽略（防止把地面噪点当成障碍物）
      #     obstacle_range: 2.5       # 只处理 2.5 米内的视觉障碍物（深度相机远距离误差大）
      #     raytrace_range: 3.0       # 清除 3.0 米内的视觉历史障碍物
      # always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 3.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: False
      rolling_window: false    # 🌟 关键修改 1：全局地图现在也跟着小车滚了
      transform_tolerance: 5.0
      footprint: "[[-0.41, -0.32], [-0.41, 0.32], [0.41, 0.32], [0.41, -0.32]]"
      resolution: 0.25
      width: 300
      height: 300
      # 🌟 关键修改 3：强制偏移原点！将左下角拉到 -100 的位置
      # 这样地图的范围就变成了 X: [-100, 100], Y: [-100, 100]
      # 你的起点 (-0.04, 0.19) 和终点 (25.09, -55.44) 就全部完美包容在地图中心了！
      origin_x: -100.0
      origin_y: -100.0
      track_unknown_space: false
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 16.0
          obstacle_max_range: 14.5
          raytrace_min_range: 0.5
          obstacle_min_range: 0.5
          # ==========================================
          # 🌟 必须加上的两行“除噪核心参数”：
          # ==========================================
          inf_is_valid: true         # 👈 第一把利器：允许使用“无穷远”清除
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 15.0    # 这个值越小，障碍物周围的“高代价危险区”范围就越大，小车会离得更远
        inflation_radius: 0.55      # 🌟 关键修改：将膨胀半径加大（例如从 0.45 加大到 0.8 米或 1.0 米）
      always_send_full_costmap: True

map_saver:
  ros__parameters:
    use_sim_time: False
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    use_sim_time: False
    transform_tolerance: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      tolerance: 0.5 # tolerance for planning if unable to reach exact pose, in meters
      downsample_costmap: true # whether or not to downsample the map
      downsampling_factor: 2 # multiplier for the resolution of the costmap layer (e.g. 2 on a 5cm costmap would be 10cm)
      allow_unknown: true # allow traveling in unknown space
      max_iterations: 400000 # maximum total iterations to search for before failing (in case unreachable), set to -1 to disable
      max_on_approach_iterations: 1000 # maximum number of iterations to attempt to reach goal once in tolerance
      terminal_checking_interval: 5000 # number of iterations between checking if the goal has been cancelled or planner timed out
      max_planning_time: 3.5 # max time in s for planner to plan, smooth, and upsample. Will scale maximum smoothing and upsampling times based on remaining time after planning.
      motion_model_for_search: "REEDS_SHEPP" # For Hybrid Dubin, Reeds-Shepp
      cost_travel_multiplier: 2.0 # For 2D: Cost multiplier to apply to search to steer away from high cost areas. Larger values will place in the center of aisles more exactly (if non-`FREE` cost potential field exists) but take slightly longer to compute. To optimize for speed, a value of 1.0 is reasonable. A reasonable tradeoff value is 2.0. A value of 0.0 effective disables steering away from obstacles and acts like a naive binary search A*.
      angle_quantization_bins: 32 # For Hybrid nodes: Number of angle bins for search, must be 1 for 2D node (no angle search)
      analytic_expansion_ratio: 3.5 # For Hybrid/Lattice nodes: The ratio to attempt analytic expansions during search for final approach.
      analytic_expansion_max_length: 8.0 # For Hybrid/Lattice nodes: The maximum length of the analytic expansion to be considered valid to prevent unsafe shortcutting (in meters). This should be scaled with minimum turning radius and be no less than 4-5x the minimum radius
      analytic_expansion_max_cost: 200 # For Hybrid/Lattice nodes: The maximum single cost for any part of an analytic expansion to contain and be valid (except when necessary on approach to goal)
      analytic_expansion_max_cost_override: false # For Hybrid/Lattice nodes: Whether or not to override the maximum cost setting if within critical distance to goal (ie probably required). If expansion is within 2*pi*min_r of the goal, then it will override the max cost if ``false``.
      # 🌟 让全局规划器敢于画更紧凑的圆
      minimum_turning_radius: 1.5
      # 🌟 将倒车惩罚从 1.3 降低到 1.0 或 1.1，鼓励小车在目标在身后时直接倒车
      reverse_penalty: 1.0 # For Reeds-Shepp model: penalty to apply if motion is reversing, must be => 1
      change_penalty: 0.0 # For Hybrid nodes: penalty to apply if motion is changing directions, must be >= 0
      non_straight_penalty: 1.05  # 🌟 从 1.20 降到 1.05，降低对转弯的排斥
      cost_penalty: 1.3           # 🌟 从 2.0 降到 1.3，允许它在膨胀区边缘进行机动
      retrospective_penalty: 0.025 # For Hybrid/Lattice nodes: penalty to prefer later maneuvers before earlier along the path. Saves search time since earlier nodes are not expanded until it is necessary. Must be >= 0.0 and <= 1.0
      rotation_penalty: 5.0 # For Lattice node: Penalty to apply only to pure rotate in place commands when using minimum control sets containing rotate in place primitives. This should always be set sufficiently high to weight against this action unless strictly necessary for obstacle avoidance or there may be frequent discontinuities in the plan where it requests the robot to rotate in place to short-cut an otherwise smooth path for marginal path distance savings.
      lookup_table_size: 20.0 # For Hybrid nodes: Size of the dubin/reeds-sheep distance window to cache, in meters.
      cache_obstacle_heuristic: True # For Hybrid nodes: Cache the obstacle map dynamic programming distance expansion heuristic between subsequent replannings of the same goal location. Dramatically speeds up replanning performance (40x) if costmap is largely static.
      allow_reverse_expansion: False # For Lattice nodes: Whether to expand state lattice graph in forward primitives or reverse as well, will double the branching factor at each step.
      smooth_path: True # For Lattice/Hybrid nodes: Whether or not to smooth the path, always true for 2D nodes.
      debug_visualizations: False # For Hybrid/Lattice nodes: Whether to publish expansions on the /expansions topic as an array of poses (the orientation has no meaning) and the path's footprints on the /planned_footprints topic. WARNING: heavy to compute and to display, for debug only as it degrades the performance.
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.4        # 🌟 原来是 0.2，调高到 0.4。这会让平滑后的路线更严格地贴合原始规划，而不是擅自拉直。
        tolerance: 1.0e-10
        do_refinement: true # Whether to recursively run the smoother 3 times on the results from prior runs to refine the results further

smoother_server:
  ros__parameters:
    use_sim_time: False
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["backup", "drive_on_heading", "assisted_teleop", "wait"]
    # spin:
    #   plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
      # 配置倒车的具体参数
      simulate_ahead_time: 2.0
      backup_x: -1.0     # 每次脱困尝试往后倒 1.0 米
      backup_speed: -0.15 # 倒车速度 0.3 m/s
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 1.0
    use_sim_time: False
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.1
    rotational_acc_lim: 2.0

robot_state_publisher:
  ros__parameters:
    use_sim_time: False

waypoint_follower:
  ros__parameters:
    use_sim_time: False
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: False
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "CLOSED_LOOP" # 建议试跑，若抖动则改回 OPEN_LOOP
    # 🌟 核心修改 3：同步修改平滑器的第三个参数 (角速度 z)
    max_velocity: [1.0, 0.0, 0.35]   # 第三个值改为 0.35
    min_velocity: [-0.25, 0.0, -0.35] # 第三个值改为 -0.35
    max_accel: [0.8, 0.0, 1.5]      # 加速平顺，但比之前有力
    max_decel: [-1.2, 0.0, -2.0]    # 刹车力度加大，应对 42kg 惯性
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.005, 0.0, 0.0]
    velocity_timeout: 1.0