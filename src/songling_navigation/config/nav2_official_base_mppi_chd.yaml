bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: False

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: False

controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 10.0   #建议提升到 20Hz，配合你的 MPPI
    transform_tolerance: 0.5 # 控制器的容忍度
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    odom_topic: /odom
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"] 
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    general_goal_checker:
      # 🌟 核心修复：把 True 改为 False！ 这意味着：不需要等待底盘完全物理静止，只要距离进入 0.8 米，瞬间宣布到达！
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.80
      yaw_goal_tolerance: 3.14
     # 🌟 修改：限制更低，确保到达终点时能判定静止并停车
      trans_stopped_velocity: 0.05 
      rot_stopped_velocity: 0.05

    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 100  #增加预测视野：由 56 增至 100，将预测距离拉长至约 10 米，覆盖 U 型掉头所需的物理空间 。
      model_dt: 0.1
      batch_size: 350 #算力平衡：增大 time_steps 后需减小采样数，确保 Orin Nano 维持 20Hz 实时性 。
      vx_std: 0.35         # 🌟 原为 0.1，调大。允许尝试更多速度变化
      vy_std: 0.0
      wz_std: 0.60         # 从 0.60 降到 0.15
      vx_max: 1.0
      vx_min: -0.45        # 🌟 从 -0.15 改为 -0.3，给它稍微快一点的倒车能力
      vy_max: 0.0
      wz_max: 0.55         # 从 0.55 降到 0.35
      wz_min: -0.55        # 从 -0.55 降到 -0.35
      iteration_count: 1
      prune_distance: 1.0 #避免路径跳变：当前 1.7 导致掉头时路径点被过早丢弃，误判掉头完成 。
      transform_tolerance: 0.5
      temperature: 0.3
      gamma: 0.015
      motion_model: "Ackermann"
      visualize: true      #仅在调试时短暂开启
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      AckermannConstraints:
        min_turning_r: 1.9
      critics:
        [
          "ConstraintCritic",
          "CostCritic",
          "GoalCritic",
          "GoalAngleCritic",
          "PathAlignCritic",
          "PathFollowCritic",
          "PathAngleCritic",
          "PreferForwardCritic",
        ]

      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 200.0

      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 1.0
        threshold_to_consider: 10.0  #这会让小车从 10 米外就开始评估“目标点方向的代价”，而不是等走过了才后悔。

      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5

      PreferForwardCritic:
        enabled: true    # 🌟 核心修改：改为 false！彻底关掉“必须朝前开”的执念！允许顺滑倒车。
        cost_power: 1
        cost_weight: 2.0   # 权重设为 2.0 即可（不要太高，保证它还有倒车掉头的勇气）
        threshold_to_consider: 0.5

      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 1000.0  #将其增加到 500.0 或 1000.0。这给了 MPPI 更大的“冒险空间”，允许它在紧急情况下通过代价较高的区域来实现避障绕行。
        consider_footprint: true
        collision_cost: 500000.0  #将 collision_cost 从 1000000.0  适当下调。过高的数值会让规划器在遇到障碍物时“由于过度恐惧而动弹不得
        near_goal_distance: 1.0
        trajectory_point_step: 2

      PathAlignCritic:
        enabled: false
        cost_power: 1
        cost_weight: 1.5 #平衡对齐与路径跟随：降低其过高的权重，防止其在掉头时为了姿态对齐而强行脱离路径 。
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false

      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 12.0   #增强循迹意愿：将权重从 2.0 提高，让机器人更“渴望”走完当前路径，而非尝试抄近道 。
        offset_from_furthest: 5
        threshold_to_consider: 1.4

      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        forward_preference: false # 🌟 核心修改：改为 false，配合全局路径的倒车指令
        # ==========================================
        # 🌟 核心修改 3：从 2 改为 1！(魔法开关)
        # mode 2 代表“不管正反，平行就行”
        # mode 1 代表“严格服从全局规划器设定的 前进/倒退 档位”
        # ==========================================
        mode: 1

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 15.0  #将 local_costmap 中的 update_frequency 提升至 10Hz 或 15Hz（目前你配置的是 5.0Hz）。5Hz 对于在室外高速行驶的机器人来说太慢了，会导致碰撞检测滞后，机器人感知到障碍物时可能已经太晚，只能急刹
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_link
      transform_tolerance: 0.5 # 局部代价地图的容忍度
      use_sim_time: False
      rolling_window: true
      width: 20
      height: 20
      resolution: 0.05
      footprint: "[[-0.41, -0.32], [-0.41, 0.32], [0.41, 0.32], [0.41, -0.32]]"
      plugins: ["obstacle_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.5    # 这个值越小，障碍物周围的“高代价危险区”范围就越大，小车会离得更远
        inflation_radius: 0.5       # 🌟 关键修改：将膨胀半径加大（例如从 0.45 加大到 0.8 米或 1.0 米）

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        # 告诉 Nav2 我们现在有两个“眼睛”：雷达(scan) 和 相机(camera)
        observation_sources: scan # camera
        scan:
          topic: /scan
          min_obstacle_height: 0.1
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          inf_is_valid: True # 如果雷达射线射向天空或没返回数据（inf），不将其作为清除地图的依据。
          data_type: "LaserScan"
          raytrace_max_range: 16.0
          obstacle_max_range: 14.5
          raytrace_min_range: 0.5
          obstacle_min_range: 0.5 # 忽略极近距离噪点和反射

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 3.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: False
      rolling_window: false    # 🌟 关键修改 1：全局地图现在也跟着小车滚了
      transform_tolerance: 5.0
      footprint: "[[-0.41, -0.32], [-0.41, 0.32], [0.41, 0.32], [0.41, -0.32]]"
      resolution: 0.25
      width: 300
      height: 300
      # 🌟 关键修改 3：强制偏移原点！将左下角拉到 -100 的位置
      # 这样地图的范围就变成了 X: [-100, 100], Y: [-100, 100]
      # 你的起点 (-0.04, 0.19) 和终点 (25.09, -55.44) 就全部完美包容在地图中心了！
      origin_x: -100.0
      origin_y: -100.0
      track_unknown_space: false
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 16.0
          obstacle_max_range: 14.5
          raytrace_min_range: 0.5
          obstacle_min_range: 0.5
          # ==========================================
          # 🌟 必须加上的两行“除噪核心参数”：
          # ==========================================
          inf_is_valid: true         # 👈 第一把利器：允许使用“无穷远”清除
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.0    # 这个值越小，障碍物周围的“高代价危险区”范围就越大，小车会离得更远
        inflation_radius: 1.2       # 🌟 关键修改：将膨胀半径加大（例如从 0.45 加大到 0.8 米或 1.0 米）
      always_send_full_costmap: True

map_saver:
  ros__parameters:
    use_sim_time: False
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    use_sim_time: False
    transform_tolerance: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      tolerance: 0.5 # 无法到达精确位姿时的规划容差（米）
      downsample_costmap: false # 🌟 核心修改：改为 false！强制在原始分辨率上进行高精度规划，生成丝滑的阿克曼曲线。
      downsampling_factor: 2 # 代价地图层的分辨率乘数（例如，在 5cm 分辨率的代价地图上，乘数为 2 时，实际分辨率为 10cm）
      allow_unknown: true # 允许在未知空间中通行
      max_iterations: 400000 # 在判定失败之前，允许搜索的最大总迭代次数（针对目标不可达的情形），设置为 -1 可禁用该限制
      max_on_approach_iterations: 1000 # 一旦进入目标容忍区间，允许的最大迭代次数（用于最终到达目标）
      terminal_checking_interval: 5000 # 每隔多少次迭代检查一次目标是否被取消或规划器是否超时
      max_planning_time: 3.5 # 规划、平滑和上采样总时长上限（单位：秒）。平滑和上采样的最大耗时将根据规划完成后剩余的时间按比例调整。
      motion_model_for_search: "REEDS_SHEPP" # 适用于 Hybrid Dubin 和 Reeds-Shepp 运动模型
      cost_travel_multiplier: 2.0 # 2D 代价乘数（避障偏置）。值越大越居中（需非 FREE 势场），但计算更慢。推荐：1.0（速度优先），2.0（折中），0.0（禁用偏置，退化为二值 A*）。
      angle_quantization_bins: 32 # 混合节点角度离散数。二维节点固定为 1（不进行角度搜索）
      analytic_expansion_ratio: 3.5 # 混合/晶格节点：搜索中尝试解析扩展接近目标的比例（频率）。
      analytic_expansion_max_length: 8.0 # 混合/晶格节点中，解析扩展有效长度的上限（米），超过此长度则视为不安全捷径而不采用。该值应与最小转弯半径成比例，且至少为最小转弯半径的 4～5 倍。
      analytic_expansion_max_cost: 200 # 混合/晶格节点中，解析扩展路径的任意一段所允许的最大单项代价，超过此值的扩展将被视为无效（但在最终逼近目标时，如有必要可以放宽此限制）。
      analytic_expansion_max_cost_override: false # 混合/晶格节点：是否在距目标临界距离内覆盖最大代价限制。若扩展到达目标周围 2π·min_r 内，且此参数为 false，则覆盖生效。
      minimum_turning_radius: 2.1 #物理适配：底盘极限半径为 1.9m，设置为 2.0m 给全局规划器留出安全余量，避免“路径不可行”的报错 。
      reverse_penalty: 2.5 # 原来是 1.3。改成 2.5 后，它绝不会规划出超过 5 米的倒车路线
      change_penalty: 0.1 # 🌟 核心修改 2：稍微加一点点换挡惩罚，防止原地反复横跳
      non_straight_penalty: 1.50  #这会促使规划器在生成路径时更倾向于长距离的平滑转弯，而非频繁的小角度修正。
      cost_penalty: 5.0 # 🌟 从 2.0 提升到 5.0。极大增强“远离障碍物、走正中间”的意愿
      retrospective_penalty: 0.025 # 混合/晶格节点：沿路径更倾向于后续机动而非较早机动的惩罚值。可节省搜索时间，因为早期节点不会在必要时才扩展。取值必须 >= 0.0 且 <= 1.0
      rotation_penalty: 5.0 # 晶格节点：当使用包含原地旋转原语的最小控制集时，仅对原地纯旋转命令施加的惩罚。该值应设置得足够高以抑制此动作，除非在避障时严格必需，否则可能导致规划中频繁出现不连续，要求机器人原地旋转以节省微小的路径距离，从而破坏原本平滑的路径。
      lookup_table_size: 20.0 # 混合节点：Dubin/Reeds-Shepp距离窗口的缓存大小，单位米。
      cache_obstacle_heuristic: True # 混合节点：在同一目标位置的后续重新规划之间，缓存障碍物地图的动态规划距离扩展启发式。如果代价地图基本静态，可大幅提升重新规划性能（40倍）。
      allow_reverse_expansion: False # 晶格节点：是否以正向原语扩展状态晶格图，还是同时允许反向扩展，这会使每一步的分支因子加倍。
      smooth_path: True # 晶格/混合节点：是否平滑路径，对于二维节点始终为真。
      debug_visualizations: False # 混合/晶格节点：是否将扩展发布到 /expansions 话题（作为姿态数组，其方向无意义），并将路径的足迹发布到 /planned_footprints 话题。警告：计算和显示开销很大，仅用于调试，会降低性能。
  
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true # Whether to recursively run the smoother 3 times on the results from prior runs to refine the results further

smoother_server:
  ros__parameters:
    use_sim_time: False
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["backup", "drive_on_heading", "assisted_teleop", "wait"]
    # spin:
    #   plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
      # 配置倒车的具体参数
      simulate_ahead_time: 2.0
      backup_x: -1.5    #如果方向反差极大，配合 Behavior Tree 触发倒车脱困 。
      backup_speed: -0.15 # 倒车速度 0.3 m/s
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 1.0
    use_sim_time: False
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.1
    rotational_acc_lim: 2.0

robot_state_publisher:
  ros__parameters:
    use_sim_time: False

waypoint_follower:
  ros__parameters:
    use_sim_time: False
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: False
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "CLOSED_LOOP" # 建议试跑，若抖动则改回 OPEN_LOOP
    # 🌟 核心修改 3：同步修改平滑器的第三个参数 (角速度 z)
    max_velocity: [1.0, 0.0, 0.55]   # 第三个值改为 0.35
    min_velocity: [-0.45, 0.0, -0.55] # 第三个值改为 -0.35
    max_accel: [0.8, 0.0, 1.5]      # 加速平顺，但比之前有力
    max_decel: [-1.2, 0.0, -2.0]    # 刹车力度加大，应对 42kg 惯性
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.005, 0.0, 0.0]
    velocity_timeout: 1.0