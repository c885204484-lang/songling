bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odometry/local
    transform_tolerance: 1.0
    enable_groot_monitoring: False
    error_code_names: ["compute_path_error", "follow_path_error"]
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000

    # 👇 🌟 核心补救：强制指派带有“倒车等恢复行为”的行为树！
    # ==========================================
    default_nav_to_pose_bt_xml: "/opt/ros/humble/share/nav2_bt_navigator/behavior_trees/navigate_to_pose_w_replanning_and_recovery.xml"
    default_nav_through_poses_bt_xml: "/opt/ros/humble/share/nav2_bt_navigator/behavior_trees/navigate_through_poses_w_replanning_and_recovery.xml"

    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node
      - nav2_is_battery_charging_condition_bt_node

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: False

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: False

controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 20.0 # 🌟 建议提高到 20Hz，真车控制更灵敏，减少 TF 延迟报错
    transform_tolerance: 0.1  # 🌟 容忍度放宽：10秒移动 10 厘米即可，防止误判卡死
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"] 
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1 # 降到 0.1
      movement_time_allowance: 10.0 # 放宽到 10.0
      
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 1.5        # 从 0.3 改为 1.0 或 1.5 米。小车只要进入目标周边 1.5 米的圆圈内，就判定任务成功。
      yaw_goal_tolerance: 3.14

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.6
      
# # 🌟 关键修改：大幅增加前瞻距离的下限和上限
#       lookahead_dist: 1.5           # 默认前瞻距离，改为 1.5
#       min_lookahead_dist: 1.0       # 🌟 关键！最小前瞻距离改为 1.0，禁止小车看脚下！
#       max_lookahead_dist: 3.0       # 最大前瞻距离改为 3.0
#       lookahead_time: 1.5    
# 🌟 优化后的合理前瞻距离，兼顾远方和脚下
      lookahead_dist: 2.0            # 基础值提高
      min_lookahead_dist: 1.5        # 最小不低于 1.5
      max_lookahead_dist: 3.5        # 最大放宽，让车在直线上看远一点
      lookahead_time: 1.5             
      
      use_rotate_to_heading: false
      allow_reversing: false  # 一般不建议自动倒车，先设为 false
      
      use_velocity_scaled_lookahead_dist: true
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 2.0 #最小转弯半径（m）
      regulated_linear_scaling_min_speed: 0.25
      # use_collision_detection: true
      # max_allowed_time_to_collision_up_to_carrot: 1.0
      inflation_cost_scaling_factor: 5.0
# 🌟 关键修改 2：开启并调大碰撞检测时间
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 2.0  # 从 1.0秒 改为 2.5秒。
      # 解释：意思是如果控制器预测小车沿当前速度开过去，在 2.5 秒内会撞上障碍物，它就会立刻减速或触发避障动作！
      
      # 👇 强制添加这三行
      use_cost_regulated_linear_velocity_scaling: true 
      cost_scaling_dist: 0.6  # 距离障碍物多远开始减速（米）
      cost_scaling_gain: 1.0  # 减速的倍率，越大减速越猛



local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0 # 重绘频率
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: False
      transform_tolerance: 0.5 # 局部代价地图的容忍度
      rolling_window: true
      width: 20
      height: 20
      resolution: 0.05
      footprint: "[[-0.41, -0.32], [-0.41, 0.32], [0.41, 0.32], [0.41, -0.32]]"
      plugins: ["obstacle_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0    # 这个值越小，障碍物周围的“高代价危险区”范围就越大，小车会离得更远
        inflation_radius: 0.6       # 🌟 关键修改：将膨胀半径加大（例如从 0.45 加大到 0.8 米或 1.0 米）
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        # 告诉 Nav2 我们现在有两个“眼睛”：雷达(scan) 和 相机(camera)
        observation_sources: scan # camera
        scan:
          topic: /scan
          min_obstacle_height: 0.15 # 🌟 稍微调高一点点，避开真车行驶时由于颠簸导致的地面误识别
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          inf_is_valid: True # 如果雷达射线射向天空或没返回数据（inf），不将其作为清除地图的依据。
          data_type: "LaserScan"
          raytrace_max_range: 16.0
          obstacle_max_range: 14.5
          raytrace_min_range: 0.2
          obstacle_min_range: 0.2 # 忽略极近距离噪点和反射
        # ==========================================
        # 🌟 新增：深度相机避障源
        # ==========================================
      #   camera:
      #     # 这里填入你 Astra Pro 输出的深度点云话题，或者是你 YOLO 3D 转换后的障碍物点云话题
      #     topic: /camera/depth/points_raw
      #     data_type: "PointCloud2"
      #     qos_reliability: "best_effort"
      #     qos_durability: "volatile"
      #     qos_history: "keep_last"
      #     qos_depth: 1
      #     marking: True       # 发现障碍物时，标记在地图上
      #     clearing: True      # 障碍物移走时，从地图上清除
      #     max_obstacle_height: 1.5  # 高于 1.5 米的物体忽略（比如天花板、树枝）
      #     min_obstacle_height: 0.05 # 低于 5 厘米的物体忽略（防止把地面噪点当成障碍物）
      #     obstacle_range: 2.5       # 只处理 2.5 米内的视觉障碍物（深度相机远距离误差大）
      #     raytrace_range: 3.0       # 清除 3.0 米内的视觉历史障碍物
      # always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 3.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: False
      transform_tolerance: 5.0
      footprint: "[[-0.41, -0.32], [-0.41, 0.32], [0.41, 0.32], [0.41, -0.32]]"
      resolution: 0.25 # 分辨率
      width: 1000
      height: 1000
      track_unknown_space: true
      plugins: ["obstacle_layer", "inflation_layer"]
      rolling_window: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          inf_is_valid: True
          data_type: "LaserScan"
          raytrace_max_range: 16.0
          obstacle_max_range: 14.5
          raytrace_min_range: 0.2
          obstacle_min_range: 0.2
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0    # 这个值越小，障碍物周围的“高代价危险区”范围就越大，小车会离得更远
        inflation_radius: 0.8       # 🌟 关键修改：将膨胀半径加大（例如从 0.45 加大到 0.8 米或 1.0 米）
      always_send_full_costmap: True

map_saver:
  ros__parameters:
    use_sim_time: False
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

