    - false
    - false
    - false
    - false
    odom0_differential: false
    odom0_relative: true
    odom0_queue_size: 10
    imu0: /rtk/imu
    imu0_config:
    - false
    - false
    - false
    - false
    - false
    - true
    - false
    - false
    - false
