  ros__parameters:
    frequency: 50.0
    sensor_timeout: 0.1
    two_d_mode: true
    dynamic_process_noise_covariance: true
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom
    odom0: /odom
