navsat_transform:
  ros__parameters:
    frequency: 10.0
    delay: 0.0
    yaw_offset: 0.0
    magnetic_declination_radians: 0.0
    zero_altitude: true
    publish_filtered_gps: false
    broadcast_utm_transform: false
    
    # 👇 这行一定要改回 true，之前你截图里写的是 false
    use_odometry_yaw: false  
    
    wait_for_datum: false  #（在 wait_for_datum: false 的情况下），navsat_transform 会将这第一个经纬度坐标作为地图的 $(0, 0)$ 原点。  

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: map